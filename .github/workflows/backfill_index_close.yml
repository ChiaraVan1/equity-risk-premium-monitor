name: Backfill CSI Index Close (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill IndexClose only
        run: python fetch/backfill_index_close.py

      - name: Commit backfilled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/erp_*.csv
          git diff --cached --quiet || git commit -m "data: backfill CSI index close [skip ci]"
          git pull --rebase origin main
          git push

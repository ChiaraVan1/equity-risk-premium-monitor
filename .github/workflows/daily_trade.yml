name: Equity Risk Premium Monitor Bot
on:
  schedule:
    # 每天 17:30 运行 (北京时间 17:30 = UTC 09:30)
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '预览模式（只生成报告文件，不推送微信）'
        type: boolean
        default: false
jobs:
  run-erp-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 4. 执行主入口（内部自动调度所有数据准备脚本）
      - name: Prepare Data and Analyze
        env:
          QQQ_PE_TODAY: ${{ vars.QQQ_PE_TODAY }}
          SCT_KEY: ${{ secrets.SCT_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python erp_position.py
      # 5. 预览模式：上传报告文件供下载查看
      - name: Upload preview report
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: output_preview.md
      # 6. 将更新后的数据保存回 GitHub 仓库
      - name: Commit and Push data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/
          git commit -m "Auto update ERP data [skip ci]" || exit 0
          git pull --rebase origin main
          git push
      # 7. 部署 HTML 报告到 gh-pages 分支
      - name: Deploy HTML report to gh-pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "Auto update report [skip ci]"

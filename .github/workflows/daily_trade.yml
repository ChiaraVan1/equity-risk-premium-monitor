name: Equity Risk Premium Monitor Bot
on:
  schedule:
    # 每天 18:00 运行（北京时间 18:00 = UTC 10:00）。
    # 给17:00开始的本地抓取、校验和推送留出完整缓冲窗口。
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '预览模式（只生成报告文件，不推送微信）'
        type: boolean
        default: false
jobs:
  run-erp-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      # 1.5 检查本地是否已于北京时间当天成功抓取并推送数据。
      #     使用精确日期标记，不再用20小时滑动窗口，避免跨日误判。
      #     只对定时触发(schedule)生效，手动触发(workflow_dispatch)不受影响、始终照常运行。
      - name: Check if local run already succeeded today
        id: check_local
        run: |
          TODAY_CST=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && git log --grep="^本地补充 ETF 数据 ${TODAY_CST}$" --format='%s' -1 | grep -q .; then
            echo "本地已于北京时间 ${TODAY_CST} 成功跑过并推送，跳过本次云端运行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # 2. 设置 Python 环境
      - name: Set up Python
        if: steps.check_local.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # 3. 安装依赖
      - name: Install dependencies
        if: steps.check_local.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 4. 执行主入口（内部自动调度所有数据准备脚本）
      - name: Prepare Data and Analyze
        if: steps.check_local.outputs.skip != 'true'
        env:
          QQQ_PE_TODAY: ${{ vars.QQQ_PE_TODAY }}
          SCT_KEY: ${{ secrets.SCT_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python erp_position.py
      # 5. 预览模式：上传报告文件供下载查看
      - name: Upload preview report
        if: ${{ github.event.inputs.dry_run == 'true' && steps.check_local.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: output_preview.md
      # 6. 将更新后的数据保存回 GitHub 仓库
      - name: Commit and Push data
        if: steps.check_local.outputs.skip != 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/
          git commit -m "Auto update ERP data [skip ci]" || exit 0
          git pull --rebase origin main
          git push
      # 7. 部署 HTML 报告到 gh-pages 分支
      - name: Deploy HTML report to gh-pages
        if: ${{ github.event.inputs.dry_run != 'true' && steps.check_local.outputs.skip != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "Auto update report [skip ci]"

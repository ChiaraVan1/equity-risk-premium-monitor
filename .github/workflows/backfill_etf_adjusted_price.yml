name: Backfill ETF Adjusted Price (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch adjusted ETF prices
        run: python fetch/fetch_etf_adjusted_price.py

      - name: Commit adjusted price cache only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf_price_adj.csv
          git diff --cached --quiet || git commit -m "data: backfill adjusted ETF prices [skip ci]"
          git pull --rebase origin main
          git push origin main

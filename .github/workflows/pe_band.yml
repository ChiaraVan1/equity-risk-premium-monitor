name: PE-Band Chart (manual)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "跑在哪个分支上（脚本和产物都在这个分支）"
        required: true
        default: "feature/pe-band-demo"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          fc-cache -f

      - name: Install deps
        run: pip install pandas matplotlib

      - name: Run pe_band.py for all followed codes
        run: python pe_band.py

      - name: Commit chart back to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pe_band_all.png
          git diff --cached --quiet || git commit -m "chore: regenerate pe-band chart for all codes"
          git push origin HEAD:${{ github.event.inputs.target_branch }}
